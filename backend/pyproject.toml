[project]
name = "statsbomb-tactics-backend"
version = "0.1.0"
description = "StatsBomb Open Data tactical analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"