services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/data
      - COMPETITION_ID=${COMPETITION_ID:-}
      - SEASON_ID=${SEASON_ID:-}
      - MIN_MATCHES=${MIN_MATCHES:-30}
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped