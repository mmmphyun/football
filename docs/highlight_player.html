  <script>
    const data = JSON.parse(document.getElementById('highlight-data').textContent);
    const canvas = document.getElementById('pitch-canvas');
    const ctx = canvas.getContext('2d');
    
    const slider = document.getElementById('frame-slider');
    const timeDisplay = document.getElementById('time-display');
    const frameCounter = document.getElementById('frame-counter');
    const actionDisplay = document.getElementById('action-display');
    const playerCountDisplay = document.getElementById('player-count');
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const speedButtons = document.querySelectorAll('.btn-speed');

    let currentFrame = 0;
    let isPlaying = false;
    let playSpeed = 1.0;
    let animInterval = null;

    slider.max = data.frames.length - 1;

    function toCanvasCoords(x, y) {
      const padding = 20;
      const w = canvas.width - padding * 2;
      const h = canvas.height - padding * 2;
      return {
        cx: padding + (x / 120.0) * w,
        cy: padding + (y / 80.0) * h
      };
    }

    function drawPitch() {
      const p = 20;
      const w = canvas.width - p * 2;
      const h = canvas.height - p * 2;

      ctx.fillStyle = '#235c43';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;

      ctx.strokeRect(p, p, w, h);

      ctx.beginPath();
      ctx.moveTo(p + w / 2, p);
      ctx.lineTo(p + w / 2, p + h);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(p + w / 2, p + h / 2, (9.15 / 80) * h, 0, Math.PI * 2);
      ctx.stroke();

      const pboxW = (16.5 / 120) * w;
      const pboxH = (40.32 / 80) * h;
      ctx.strokeRect(p, p + (h - pboxH) / 2, pboxW, pboxH);
      ctx.strokeRect(p + w - pboxW, p + (h - pboxH) / 2, pboxW, pboxH);

      const gboxW = (5.5 / 120) * w;
      const gboxH = (18.32 / 80) * h;
      ctx.strokeRect(p, p + (h - gboxH) / 2, gboxW, gboxH);
      ctx.strokeRect(p + w - gboxW, p + (h - gboxH) / 2, gboxW, gboxH);

      ctx.fillStyle = '#ffffff';
      const goalW = (2.4 / 120) * w;
      const goalH = (7.32 / 80) * h;
      ctx.fillRect(p - goalW, p + (h - goalH) / 2, goalW, goalH);
      ctx.fillRect(p + w, p + (h - goalH) / 2, goalW, goalH);
    }

    function renderFrame(idx) {
      const frame = data.frames[idx];
      drawPitch();

      timeDisplay.textContent = frame.game_time;
      frameCounter.textContent = `${idx} / ${data.frames.length - 1}`;
      actionDisplay.textContent = frame.active_event;
      slider.value = idx;

      let argCount = 0;
      let fraCount = 0;

      // Draw Players with Opacity Fade
      frame.players.forEach(p => {
        const opacity = (p.opacity !== undefined) ? p.opacity : 1.0;
        if (opacity <= 0.02) return;

        const { cx, cy } = toCanvasCoords(p.loc[0], p.loc[1]);
        const isArg = p.team === 'Argentina';
        if (isArg) argCount++; else fraCount++;

        ctx.save();
        ctx.globalAlpha = opacity;

        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI * 2);
        
        if (p.role === 'actor') {
          ctx.fillStyle = '#e11d48'; // Bright Red
        } else if (isArg) {
          ctx.fillStyle = '#38bdf8'; // Sky Blue
        } else {
          ctx.fillStyle = '#1e3a8a'; // Navy Blue
        }
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Player Name Tag
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        const label = p.name.length > 12 ? p.name.split(' ').pop() : p.name;
        ctx.fillText(label, cx, cy - 12);

        ctx.restore();
      });

      playerCountDisplay.textContent = `ARG: ${argCount}명 | FRA: ${fraCount}명`;

      // Draw Ball
      const { cx: bx, cy: by } = toCanvasCoords(frame.ball_location[0], frame.ball_location[1]);
      ctx.beginPath();
      ctx.arc(bx, by, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function startPlayback() {
      if (animInterval) clearInterval(animInterval);
      isPlaying = true;
      btnPlay.textContent = '일시정지 (Pause)';
      btnPlay.classList.add('active');

      const intervalMs = (1000 / data.fps) / playSpeed;
      animInterval = setInterval(() => {
        if (currentFrame >= data.frames.length - 1) {
          stopPlayback();
          return;
        }
        currentFrame++;
        renderFrame(currentFrame);
      }, intervalMs);
    }

    function stopPlayback() {
      if (animInterval) clearInterval(animInterval);
      animInterval = null;
      isPlaying = false;
      btnPlay.textContent = '재생 (Play)';
      btnPlay.classList.remove('active');
    }

    btnPlay.addEventListener('click', () => {
      if (isPlaying) stopPlayback();
      else {
        if (currentFrame >= data.frames.length - 1) currentFrame = 0;
        startPlayback();
      }
    });

    btnReset.addEventListener('click', () => {
      stopPlayback();
      currentFrame = 0;
      renderFrame(0);
    });

    slider.addEventListener('input', (e) => {
      stopPlayback();
      currentFrame = parseInt(e.target.value, 10);
      renderFrame(currentFrame);
    });

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playSpeed = parseFloat(btn.getAttribute('data-speed'));
        if (isPlaying) {
          stopPlayback();
          startPlayback();
        }
      });
    });

    renderFrame(0);
  </script>
</body>
</html>
